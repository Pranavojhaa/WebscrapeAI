<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password reset · WebScrapeAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='password_reset.js') }}" defer></script>
</head>
<body class="auth-body">
    <main class="auth-card">
        <a class="demo-brand auth-brand" href="{{ url_for('login') }}" aria-label="WebScrapeAI sign in">
            <span class="brand-mark" aria-hidden="true">W</span>
            <span>WebScrape<span>AI</span></span>
        </a>
        <p class="eyebrow">PRIVATE WORKSPACE</p>
        <h1>Reset your password</h1>
        {% if error %}<div class="message error" role="alert">{{ error }}</div>{% endif %}
        {% if message %}<div class="message success" role="status">{{ message }}</div>{% endif %}
        <form id="reset-request-form" method="post" action="{{ url_for('password_reset') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <p class="intro">Enter your account email. If it matches an active account, we’ll email a reset link.</p>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
            <button type="submit">Email reset link</button>
        </form>
        <form id="reset-confirm-form" data-show-reset="{{ 'true' if show_reset_form else 'false' }}" method="post" action="{{ url_for('password_reset_confirm') }}" class="auth-form" hidden>
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input id="reset-token" type="hidden" name="token" value="{{ reset_token }}">
            <p class="intro">Choose a new password with at least 16 characters.</p>
            <label for="new-password">New password</label>
            <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="16" maxlength="1024" required>
            <button type="submit">Set new password</button>
        </form>
        <noscript><p class="auth-footnote">Enable JavaScript to open a secure reset link.</p></noscript>
        <p class="auth-footnote"><a href="{{ url_for('login') }}">Back to sign in</a></p>
    </main>
</body>
</html>
