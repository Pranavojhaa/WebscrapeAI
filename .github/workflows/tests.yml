name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-demo.txt
            .github/requirements-ci.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: ruff check --select F src tests
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-demo.txt
            .github/requirements-ci.txt
            requirements-selenium.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: pip-audit -r requirements.txt -r requirements-selenium.txt -r requirements-demo.txt

  browser-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-selenium.txt
      - run: python -m pip install -r requirements-selenium.txt
      - name: Configure browser binaries
        run: |
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || true)"
          chromedriver_path="$(command -v chromedriver || true)"
          if [ -z "$chromedriver_path" ] && [ -n "${CHROMEWEBDRIVER:-}" ]; then
            chromedriver_path="${CHROMEWEBDRIVER}/chromedriver"
          fi
          test -n "$chrome_bin"
          test -n "$chromedriver_path"
          test -x "$chrome_bin"
          test -x "$chromedriver_path"
          echo "CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=$chromedriver_path" >> "$GITHUB_ENV"
          echo "RUN_SELENIUM_INTEGRATION=1" >> "$GITHUB_ENV"
          "$chrome_bin" --version
          "$chromedriver_path" --version
      - run: python -m unittest discover -s tests -p 'test_browser_integration.py' -v
