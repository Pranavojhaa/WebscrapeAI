projects:
  - name: webscrapeai
    environments:
      - name: demo
        networking:
          isolation: enabled
        services:
          - type: web
            name: webscrapeai-demo
            runtime: python
            region: singapore
            plan: 0.5c-512mb
            autoDeployTrigger: checksPass
            buildCommand: pip install --require-hashes -r requirements-demo.txt
            startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 40 src.demo_app:app
            healthCheckPath: /health
            envVars:
              - key: APP_ENV
                value: production
              - key: APP_MODE
                value: demo
              - key: PYTHON_VERSION
                value: 3.12.11
